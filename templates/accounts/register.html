{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account | ConnectPlus{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg-light);">
    <div style="width: 100%; max-width: 440px; background: var(--surface-light); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 40px 32px; box-shadow: var(--shadow-lg);">
        
        <!-- App Branding -->
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; text-align: center;">
            <div style="width: 48px; height: 48px; background: rgba(37, 99, 235, 0.1); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary-light);">Get started with ConnectPlus</h1>
            <p style="font-size: 0.875rem; color: var(--text-secondary-light); margin-top: 4px;">Create your account in seconds</p>
        </div>

        <!-- Social Auth: Continue with Google (POST Form) -->
        <form method="POST" action="{% url 'social:begin' 'google-oauth2' %}" style="width: 100%;">
            {% csrf_token %}
            <button type="submit" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 10px 16px; background: var(--surface-light); border: 1px solid var(--border-light); border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 600; color: var(--text-primary-light); cursor: pointer; transition: var(--transition);" onmouseover="this.style.borderColor='#94A3B8'" onmouseout="this.style.borderColor='var(--border-light)'">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
        </form>

        <!-- Divider -->
        <div style="display: flex; align-items: center; margin: 20px 0;">
            <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
            <span style="padding: 0 12px; font-size: 0.75rem; color: var(--text-secondary-light); text-transform: uppercase;">or register with details</span>
            <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
        </div>

        <!-- Registration Form -->
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            
            <div style="margin-bottom: 14px;">
                <label style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px; color: var(--text-primary-light);">Username</label>
                <input type="text" name="username" class="input-field" placeholder="Choose a username" required>
            </div>

            <div style="margin-bottom: 14px;">
                <label style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px; color: var(--text-primary-light);">Email Address</label>
                <input type="email" name="email" class="input-field" placeholder="aliyu@example.com" required>
            </div>

            <div style="margin-bottom: 14px;">
                <label style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px; color: var(--text-primary-light);">Password</label>
                <input type="password" name="password1" class="input-field" placeholder="At least 8 characters" required>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px; color: var(--text-primary-light);">Confirm Password</label>
                <input type="password" name="password2" class="input-field" placeholder="Repeat password" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px;">Create Account</button>
        </form>

        <!-- Footer Link -->
        <p style="text-align: center; font-size: 0.8125rem; color: var(--text-secondary-light); margin-top: 24px;">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--brand-primary); font-weight: 600; text-decoration: none;">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
